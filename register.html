<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrazione - Sensore T&H</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f4f8;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .login-card {
            background: white;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 360px;
        }
        h2 {
            margin-top: 0;
            color: #2d3748;
            text-align: center;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #4a5568;
            font-size: 0.9em;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .password-container {
            position: relative;
        }
        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #718096;
            user-select: none;
        }
        .password-rules {
            color: #e53e3e;
            font-size: 0.75em;
            margin-top: 4px;
        }
        .input-default {
            color: #a0aec0;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #48bb78;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1em;
        }
        button:hover {
            background: #38a169;
        }
        .error {
            color: #e53e3e;
            font-size: 0.85em;
            margin-bottom: 16px;
            text-align: center;
            display: none;
        }
        .success {
            color: #2f855a;
            font-size: 0.85em;
            margin-bottom: 16px;
            text-align: center;
            display: none;
        }
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.9em;
            color: #718096;
        }
        .footer a {
            color: #4299e1;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Crea Account</h2>
        <div id="errorMessage" class="error"></div>
        <div id="successMessage" class="success"></div>
        <form id="registerForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-container">
                    <input type="password" id="password" class="input-default">
                    <span id="togglePassword" class="password-toggle">👁️</span>
                </div>
                <div class="password-rules">
                    Minimo 8 caratteri, una maiuscola, un numero e un simbolo tra: , . ? ! % $ #
                </div>
            </div>
            <button type="submit">Registrati</button>
        </form>
        <div class="footer">
            Hai già un account? <a href="login.html">Accedi</a>
        </div>
    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');
        let defaultPassword = '';
        let isDefaultUsed = true;

        function generatePassword() {
            const uppers = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
            const numbers = '23456789';
            const symbols = ',.?!%$#';
            const all = 'abcdefghijkmnopqrstuvwxyz' + uppers + numbers + symbols;

            let password = '';
            password += uppers.charAt(Math.floor(Math.random() * uppers.length));
            password += numbers.charAt(Math.floor(Math.random() * numbers.length));
            password += symbols.charAt(Math.floor(Math.random() * symbols.length));

            for (let i = 0; i < 5; i++) {
                password += all.charAt(Math.floor(Math.random() * all.length));
            }

            return password.split('').sort(() => 0.5 - Math.random()).join('');
        }

        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        function validatePassword(pass) {
            if (pass.length < 8) return false;
            if (!/[A-Z]/.test(pass)) return false;
            if (!/[0-9]/.test(pass)) return false;
            if (!/[,.?!%$#]/.test(pass)) return false;
            return true;
        }

        // Initialize default password
        defaultPassword = generatePassword();
        passwordInput.value = defaultPassword;
        passwordInput.type = 'text'; // Show it initially as it is a "system generated" one in grey
        togglePassword.textContent = '🙈';

        passwordInput.addEventListener('keydown', function(e) {
            if (isDefaultUsed) {
                passwordInput.value = '';
                passwordInput.classList.remove('input-default');
                passwordInput.type = 'password';
                isDefaultUsed = false;
            }
        });

        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.textContent = type === 'password' ? '👁️' : '🙈';
        });

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            let pass = passwordInput.value;
            const errorEl = document.getElementById('errorMessage');
            const successEl = document.getElementById('successMessage');

            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            if (!validateEmail(email)) {
                errorEl.textContent = 'Formato email non valido (es. xxxx@yyyy.zz)';
                errorEl.style.display = 'block';
                return;
            }

            if (!validatePassword(pass)) {
                errorEl.textContent = 'La password non rispetta i requisiti di complessità';
                errorEl.style.display = 'block';
                return;
            }

            fetch('auth.php?action=register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, email: email, password: pass })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    let msg = 'Registrazione completata! Controlla la tua email per confermare l\'account.';
                    if (data.note) msg = data.note;
                    successEl.textContent = msg;
                    successEl.style.display = 'block';
                } else {
                    errorEl.textContent = data.error || 'Errore di registrazione';
                    errorEl.style.display = 'block';
                }
            })
            .catch(err => {
                errorEl.textContent = 'Errore di connessione';
                errorEl.style.display = 'block';
            });
        });
    </script>
</body>
</html>
