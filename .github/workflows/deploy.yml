name: Deploy su Raspberry Pi

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.RPI_HOST }}
          username: ${{ secrets.RPI_USER }}
          key: ${{ secrets.RPI_SSH_KEY }}
          script: |
            echo "Starting..." >> /home/sthor69/logging
            cd /home/sthor69/workspace/smarthome/
            git pull origin main
            sudo cp * /var/www/smarthome/
            
