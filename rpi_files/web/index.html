<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensore T&H - Storia</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <style>
        * { box-sizing: border-box; }
        html, body {
            min-height: 100%;
            overflow-y: auto;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 960px;
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2d3748;
            text-align: center;
            margin-top: 0;
            font-size: 1.5em;
        }
        .cards {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .card {
            flex: 1;
            max-width: 200px;
            padding: 16px;
            border-radius: 10px;
            text-align: center;
        }
        .card.temp { background: #fff5f5; border: 1px solid #fed7d7; }
        .card.hum  { background: #ebf8ff; border: 1px solid #bee3f8; }
        .card .label { font-size: 0.8em; color: #718096; margin-bottom: 4px; }
        .card .value { font-size: 2em; font-weight: bold; }
        .card.temp .value { color: #e53e3e; }
        .card.hum  .value { color: #3182ce; }
        .card .unit { font-size: 0.9em; color: #718096; }

        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 16px;
        }
        .controls button {
            padding: 6px 16px;
            border: 1px solid #cbd5e0;
            border-radius: 20px;
            background: white;
            color: #4a5568;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.2s;
        }
        .controls button:hover { background: #edf2f7; }
        .controls button.active {
            background: #4299e1;
            color: white;
            border-color: #4299e1;
        }

        .custom-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
            align-items: center;
            font-size: 0.85em;
            color: #4a5568;
        }
        .custom-controls input {
            padding: 4px 8px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            color: #4a5568;
        }
        .custom-controls button {
            padding: 6px 16px;
            border: 1px solid #cbd5e0;
            border-radius: 20px;
            background: #edf2f7;
            color: #4a5568;
            cursor: pointer;
            transition: all 0.2s;
        }
        .custom-controls button:hover { background: #cbd5e0; }

        .nav-btn {
            padding: 4px 10px !important;
            border-radius: 4px !important;
            margin: 0 2px;
            font-weight: bold;
        }

        .chart-container {
            position: relative;
            height: 380px;
            width: 100%;
        }
        .status {
            text-align: center;
            margin-top: 12px;
            font-size: 0.8em;
            color: #a0aec0;
        }
        .status.error { color: #e53e3e; }
    </style>
</head>
<body>
<div class="container">
    <h1>🌡️ Temperatura &amp; Umidità</h1>

    <!-- Card valori attuali -->
    <div class="cards">
        <div class="card temp">
            <div class="label">Ultima temperatura</div>
            <div class="value" id="lastTemp">--</div>
            <div class="unit">°C</div>
        </div>
        <div class="card hum">
            <div class="label">Ultima umidità</div>
            <div class="value" id="lastHum">--</div>
            <div class="unit">%</div>
        </div>
    </div>

    <!-- Selettore periodo -->
    <div class="controls">
        <button onclick="setPeriod(1)"    class="active" id="btn1">1 ora</button>
        <button onclick="setPeriod(6)"    id="btn6">6 ore</button>
        <button onclick="setPeriod(24)"   id="btn24">24 ore</button>
        <button onclick="setPeriod(168)"  id="btn168">7 giorni</button>
        <button onclick="setPeriod(720)"  id="btn720">30 giorni</button>
        <button onclick="setPeriod(0)"    id="btn0">Tutto</button>
    </div>

    <div class="custom-controls">
        <label for="startDate">Da:</label>
        <button class="nav-btn" onclick="adjustTime('startDate', -15)">-</button>
        <input type="datetime-local" id="startDate" step="300">
        <button class="nav-btn" onclick="adjustTime('startDate', 15)">+</button>

        <label for="endDate">A:</label>
        <button class="nav-btn" onclick="adjustTime('endDate', -15)">-</button>
        <input type="datetime-local" id="endDate" step="300">
        <button class="nav-btn" onclick="adjustTime('endDate', 15)">+</button>

        <button onclick="applyCustomRange()">Applica</button>
    </div>

    <div class="chart-container">
        <canvas id="sensorChart"></canvas>
    </div>
    <div id="status" class="status">Caricamento...</div>
</div>

<script>
    let sensorChart;
    let currentHours = 1;

    const periodBtns = {
        1: 'btn1', 6: 'btn6', 24: 'btn24',
        168: 'btn168', 720: 'btn720', 0: 'btn0'
    };

    function roundTo5Minutes(d) {
        d.setMinutes(Math.round(d.getMinutes() / 5) * 5);
        d.setSeconds(0);
        d.setMilliseconds(0);
        return d;
    }

    function formatDateForInput(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        const h = String(d.getHours()).padStart(2, '0');
        const min = String(d.getMinutes()).padStart(2, '0');
        return `${y}-${m}-${day}T${h}:${min}`;
    }

    function adjustTime(id, deltaMinutes) {
        const el = document.getElementById(id);
        let val = el.value;
        let d;

        if (val) {
            d = new Date(val);
        } else {
            d = new Date();
        }

        d.setMinutes(d.getMinutes() + deltaMinutes);
        roundTo5Minutes(d);
        el.value = formatDateForInput(d);
    }

    document.getElementById('startDate').addEventListener('change', function() {
        if (this.value) {
            const d = new Date(this.value);
            roundTo5Minutes(d);
            this.value = formatDateForInput(d);
        }
    });

    document.getElementById('endDate').addEventListener('change', function() {
        if (this.value) {
            const d = new Date(this.value);
            roundTo5Minutes(d);
            this.value = formatDateForInput(d);
        }
    });

    function setPeriod(hours) {
        document.getElementById('startDate').value = '';
        document.getElementById('endDate').value = '';
        currentHours = hours;
        Object.entries(periodBtns).forEach(([h, id]) => {
            document.getElementById(id).classList.toggle('active', parseInt(h) === hours);
        });
        updateChart();
    }

    function applyCustomRange() {
        const startVal = document.getElementById('startDate').value;
        const endVal = document.getElementById('endDate').value;

        if (!startVal || !endVal) {
            alert('Inserisci sia la data di inizio che quella di fine.');
            return;
        }

        // Disattiva pulsanti preset
        Object.values(periodBtns).forEach(id => {
            document.getElementById(id).classList.remove('active');
        });

        updateChart();
    }

    function formatLabel(timestamp) {
        const d = new Date(timestamp.replace(' ', 'T') + 'Z');
        if (currentHours <= 6) {
            return d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
        } else if (currentHours <= 48) {
            return d.toLocaleString('it-IT', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
        } else {
            return d.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', hour: '2-digit' }) + 'h';
        }
    }

    function updateChart() {
        const startVal = document.getElementById('startDate').value;
        const endVal = document.getElementById('endDate').value;

        let url = 'data.php';
        if (startVal && endVal) {
            const startD = new Date(startVal);
            const endD = new Date(endVal);

            // Convert to UTC for the database (YYYY-MM-DD HH:mm:ss)
            const toSqlUtc = (d) => d.getUTCFullYear() + '-' +
                String(d.getUTCMonth() + 1).padStart(2, '0') + '-' +
                String(d.getUTCDate()).padStart(2, '0') + ' ' +
                String(d.getUTCHours()).padStart(2, '0') + ':' +
                String(d.getUTCMinutes()).padStart(2, '0') + ':00';

            url += `?start=${encodeURIComponent(toSqlUtc(startD))}&end=${encodeURIComponent(toSqlUtc(endD))}`;
            currentHours = (endD - startD) / (1000 * 60 * 60);
        } else if (currentHours > 0) {
            url += `?hours=${currentHours}`;
        }

        fetch(url)
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    setStatus('Errore: ' + data.error, true);
                    return;
                }
                if (data.length === 0) {
                    setStatus('Nessun dato nel periodo selezionato.', false);
                    return;
                }

                const labels = data.map(r => formatLabel(r.timestamp));
                const temps  = data.map(r => r.temperature);
                const hums   = data.map(r => r.humidity);

                // Aggiorna card
                document.getElementById('lastTemp').textContent = temps[temps.length - 1].toFixed(1);
                document.getElementById('lastHum').textContent  = hums[hums.length - 1].toFixed(1);

                if (sensorChart) {
                    sensorChart.data.labels = labels;
                    sensorChart.data.datasets[0].data = temps;
                    sensorChart.data.datasets[1].data = hums;
                    sensorChart.update();
                } else {
                    const ctx = document.getElementById('sensorChart').getContext('2d');
                    sensorChart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels,
                            datasets: [
                                {
                                    label: 'Temperatura (°C)',
                                    data: temps,
                                    borderColor: 'rgb(229, 62, 62)',
                                    backgroundColor: 'rgba(229, 62, 62, 0.1)',
                                    borderWidth: 2,
                                    pointRadius: data.length > 100 ? 0 : 3,
                                    tension: 0.3,
                                    yAxisID: 'yTemp',
                                },
                                {
                                    label: 'Umidità (%)',
                                    data: hums,
                                    borderColor: 'rgb(49, 130, 206)',
                                    backgroundColor: 'rgba(49, 130, 206, 0.1)',
                                    borderWidth: 2,
                                    pointRadius: data.length > 100 ? 0 : 3,
                                    tension: 0.3,
                                    yAxisID: 'yHum',
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            interaction: { mode: 'index', intersect: false },
                            plugins: {
                                legend: { position: 'top' },
                                tooltip: {
                                    callbacks: {
                                        label: ctx => {
                                            const unit = ctx.datasetIndex === 0 ? '°C' : '%';
                                            return ` ${ctx.dataset.label}: ${ctx.parsed.y.toFixed(1)} ${unit}`;
                                        }
                                    }
                                }
                            },
                            scales: {
                                x: {
                                    ticks: {
                                        maxTicksLimit: 10,
                                        maxRotation: 30,
                                        font: { size: 11 }
                                    }
                                },
                                yTemp: {
                                    type: 'linear',
                                    position: 'left',
                                    title: { display: true, text: 'Temperatura (°C)', color: 'rgb(229,62,62)' },
                                    ticks: { color: 'rgb(229,62,62)' },
                                    grid: { color: 'rgba(229,62,62,0.1)' }
                                },
                                yHum: {
                                    type: 'linear',
                                    position: 'right',
                                    min: 0, max: 100,
                                    title: { display: true, text: 'Umidità (%)', color: 'rgb(49,130,206)' },
                                    ticks: { color: 'rgb(49,130,206)' },
                                    grid: { drawOnChartArea: false }
                                }
                            }
                        }
                    });
                }

                const ts = new Date(data[data.length-1].timestamp.replace(' ','T')+'Z');
                setStatus(`Aggiornato: ${new Date().toLocaleTimeString('it-IT')} — ultimo dato: ${ts.toLocaleString('it-IT')}`);
            })
            .catch(e => setStatus('Errore fetch: ' + e, true));
    }

    function setStatus(msg, isError = false) {
        const el = document.getElementById('status');
        el.textContent = msg;
        el.className = 'status' + (isError ? ' error' : '');
    }

    updateChart();
    setInterval(updateChart, 30000);
</script>
</body>
</html>
